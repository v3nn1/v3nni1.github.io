const KEYNAME='rogpv-key-'+SALT.slice(0,8);
async function derive(pw){ const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']); }
async function open(key){ const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA)); const html=new TextDecoder().decode(buf); document.open(); document.write(html); document.close(); }
window.addEventListener('load',async()=>{ try{ const raw=localStorage.getItem(KEYNAME); if(raw){ const key=await crypto.subtle.importKey('raw',b64(raw),{name:'AES-GCM'},true,['decrypt']); await open(key); } }catch(e){ try{localStorage.removeItem(KEYNAME);}catch(_){} } });
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault(); const err=document.getElementById('err'); err.textContent='Checking…';
  try{ const key=await derive(document.getElementById('pw').value);
    if(document.getElementById('rem').checked){ try{ const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key)); localStorage.setItem(KEYNAME,btoa(String.fromCharCode(...raw))); }catch(_){} }
    await open(key);
  }catch(x){ err.textContent='Wrong password.'; }
});
</script>
